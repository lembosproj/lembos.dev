name: Pull request

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install the test browser
        run: pnpm --filter frontend exec playwright install --with-deps chromium

      - name: Test
        run: pnpm --filter frontend test

      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            src/frontend/playwright-report
            src/frontend/test-results
          retention-days: 7

  # Dependabot's minor and patch updates merge themselves once the site builds and its tests pass. Majors wait
  # for a person: they are the kind that needs reading. Merging here, after `test`, rather than with GitHub's
  # auto-merge, means nothing merges untested even if no branch rule requires the check.
  dependabot:
    name: Merge Dependabot update
    needs: test
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Read the update
        id: update
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge
        if: steps.update.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A merge made with GITHUB_TOKEN starts no push workflows, so the site would not redeploy on its own.
      - name: Deploy
        if: steps.update.outputs.update-type != 'version-update:semver-major'
        run: gh workflow run deploy.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
