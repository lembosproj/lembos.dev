name: Deploy

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab — and lets lembosproj/deploy's release
  # workflow run it, so a new chart release reaches the docs as soon as it is published.
  workflow_dispatch:

  # The docs take their version numbers from lembosproj/deploy's latest release at build time
  # (src/frontend/tools/release.mjs). Rebuilt daily too, so a release still arrives within a day if the
  # release workflow could not start this one.
  schedule:
    - cron: "17 5 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      # One install for the workspace; pnpm runs the build under the Node version
      # pnpm-workspace.yaml names.
      - name: Install dependencies
        run: pnpm install

      # next.config.mjs reads the base path from PAGES_BASE_PATH itself. The action's own
      # injection rewrites the config's exported object, which the MDX wrapper hides from it.
      - name: Setup Pages
        id: setup_pages
        uses: actions/configure-pages@v6

      # Before the cache, so the release is part of its key: the docs' version numbers come from this file,
      # and a build cache restored from before a release must not be reused after it.
      - name: Fetch the latest release
        run: node src/frontend/tools/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Restore cache
        uses: actions/cache@v6
        with:
          path: |
            src/frontend/dist/cache
          # Generate a new cache whenever packages or source files change.
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx', '**.mjs', 'docs/**', 'src/frontend/lib/release.json') }}
          # If source files changed but packages didn't, rebuild from a prior cache.
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Build with Next.js
        run: pnpm run build
        env:
          PAGES_BASE_PATH: ${{ steps.setup_pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./src/frontend/dist

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
